# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# template for the changelog footer
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

This changelog is automatically updated weekly by a cron job

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} \
          {% if commit.breaking and group == 'chore' %}(**breaking**) {% endif %}\
        ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else %}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /tree/{{ release.version }}
        {% endif -%}
    {% else -%}
    [Unreleased]: \
        {% if release.previous.version -%}
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..HEAD
        {% else -%}
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /tree/HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}\
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# whether to filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing commits
commit_preprocessors = [
  # handle merge commits not prefixed with "merge:" (thanks Github!)
  { pattern = "(Merge .*)", replace = "merge: ($1)" },
]
# regex for parsing and grouping commits
commit_parsers = [
  # skip initial commits ("Initial commit", "Create LICENSE")
  { sha = "ecc42e3d8606da0f609821e35e1c60aabb4b9971", skip = true },
  { sha = "415760c384a47abcf799517fca9ef70199066005", skip = true },
  # Use `embedded-io` for IO operations
  { sha = "4799387b2beca680fb0c63a010ea217c540fb749", group = "Added" },
  # Truncate now truncates to the current cursor position
  { sha = "28824451e27238798ed896a8e4fc05dfacdecab3", group = "Fixed" },
  { message = "^chore", skip = true },
  { message = "^revert", skip = true },
  { message = "^merge", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^docs", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^.*: add", group = "Added" },
  { message = "^.*: create", group = "Added" },
  { message = "^.*support", group = "Added" },
  { message = "^.*: implement", group = "Added" },
  { message = "^.*: remove", group = "Removed" },
  { message = "^.*: delete", group = "Removed" },
  { message = "^test", group = "Testing" },
  { message = "^fix", group = "Fixed" },
  { message = "^.*: fix", group = "Fixed" },
  { message = "^.*", group = "Changed" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = true
# regex for matching git tags
tag_pattern = "v[0-9].*"
# regex for skipping tags
skip_tags = ""
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
