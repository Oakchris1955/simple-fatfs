name: Cargo Build & Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v4
      - run: rustup override set ${{ matrix.toolchain }}
      - uses: romnn/cargo-feature-combinations@main
      - name: Build target combinations
        timeout-minutes: 2
        run: cargo fc build
      - name: Test target combinations
        timeout-minutes: 5
        run: cargo fc test
      - name: Install nextest (nightly only)
        if: ${{ matrix.toolchain == 'nightly' }}
        uses: taiki-e/install-action@nextest
      - name: Install Miri (nightly only)
        if: ${{ matrix.toolchain == 'nightly' }}
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Run tests - Big endian target (nightly only)
        timeout-minutes: 10
        if: ${{ matrix.toolchain == 'nightly' }}
        run: cargo miri nextest run --target powerpc-unknown-linux-gnu --verbose

